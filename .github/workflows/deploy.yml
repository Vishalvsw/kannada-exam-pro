name: Deploy
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
